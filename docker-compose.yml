version: '3.8'

services:
  # 1. MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: warehouse-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: warehouse
      MYSQL_USER: warehouse
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      # [防冲突] 宿主机 3307 -> 容器 3306
      - "3307:3306"
    networks:
      - warehouse-net
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: warehouse-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    ports:
      # [防冲突] 宿主机 6380 -> 容器 6379
      - "6380:6379"
    networks:
      - warehouse-net
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. 后端服务 (Go)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: warehouse-backend:latest
    container_name: warehouse-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: "${MYSQL_DSN}"
      MYSQL_DSN: "${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(warehouse-mysql:3306)/warehouse?charset=utf8mb4&parseTime=True&loc=Local"
      SPRING_REDIS_HOST: warehouse-redis
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_ADDR: "warehouse-redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GIN_MODE: release
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # [防冲突] 宿主机 9090 -> 容器 8080
      - "9090:8080"
    networks:
      - warehouse-net
    volumes:
      - backend-logs:/app/logs
      - upload-files:/app/uploads
      - ./backend/config:/app/config

  # 4. 前端服务 (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: warehouse-frontend:latest
    container_name: warehouse-frontend
    restart: always
    depends_on:
      - backend
    ports:
      # [防冲突] 宿主机 8090 -> 容器 80
      - "8090:80"
      - "8443:443"
    networks:
      - warehouse-net
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend-logs:/var/log/nginx

volumes:
  mysql-data:
  redis-data:
  backend-logs:
  upload-files:
  frontend-logs:


networks:
  warehouse-net:
    driver: bridge
